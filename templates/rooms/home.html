<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Airbnb Clone</title>
</head>
<body>
    <h1>Rooms</h1>
    <ul>
    {% for room in rooms %}
        <li>{{ room.name }} - ${{ room.price }}</li>
    {% empty %}
        <li>No rooms available.</li>
    {% endfor %}
    </ul>
</body>
</html>
